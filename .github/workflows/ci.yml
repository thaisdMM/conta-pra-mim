name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions: {}

jobs:
  qualidade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.1"

      - name: Instalar o Python
        run: uv python install

      - name: Instalar as dependências
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatação
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      - name: Tipos
        if: ${{ !cancelled() }}
        run: uv run mypy

  testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.1"

      - name: Instalar o Python
        run: uv python install

      - name: Instalar as dependências
        run: uv sync --locked

      - name: Rodar os testes
        run: uv run pytest || test $? -eq 5
